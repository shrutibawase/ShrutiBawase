<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.96); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .pulsing-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    .badge-float {
      animation: float 4s infinite ease-in-out;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      fill: #ffffff;
    }
    .sub-text {
      font-family: 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #e2e8f0;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #4ade80;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="256" rx="16" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="2" y="2" width="916" height="256" rx="16" fill="url(#grid)" />

  <!-- Top Ambient Glow -->
  <circle cx="460" cy="20" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="780" cy="80" r="100" fill="#a855f7" opacity="0.1" filter="blur(40px)" />
  <circle cx="140" cy="180" r="100" fill="#0052d4" opacity="0.1" filter="blur(40px)" />

  <!-- Live Status Badge -->
  <g transform="translate(325, 26)">
    <rect x="0" y="0" width="270" height="24" rx="12" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1" />
    <circle cx="16" cy="12" r="4.5" fill="#22c55e" class="pulsing-dot" />
    <text x="30" y="16" class="status-text">Available for High-Impact Leadership</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(460, 96)" text-anchor="middle">
    <text class="title-text" font-size="44" filter="url(#glow)">SHRUTI BAWASE</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(460, 130)" text-anchor="middle">
    <text class="sub-text">LEAD DEVSECOPS &bull; ENTERPRISE CLOUD ARCHITECT &bull; AI / LLMOPS PIONEER</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(45, 172)">
    <!-- Badge 1: 100+ Migrations -->
    <g transform="translate(0, 0)">
      <rect width="188" height="52" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="18" y="23" font-family="sans-serif" font-size="16" font-weight="900" fill="#38bdf8">🚀 100+ Workloads</text>
      <text x="18" y="41" class="tag-text" fill="#94a3b8">Zero-Downtime Migration</text>
    </g>

    <!-- Badge 2: FinOps -->
    <g transform="translate(208, 0)">
      <rect width="188" height="52" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1" />
      <text x="18" y="23" font-family="sans-serif" font-size="16" font-weight="900" fill="#4ade80">💰 28%+ FinOps</text>
      <text x="18" y="41" class="tag-text" fill="#94a3b8">Cloud OPEX Reduction</text>
    </g>

    <!-- Badge 3: SLSA L3 DevSecOps -->
    <g transform="translate(416, 0)">
      <rect width="198" height="52" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
      <text x="18" y="23" font-family="sans-serif" font-size="16" font-weight="900" fill="#c084fc">🔒 SLSA Level 3</text>
      <text x="18" y="41" class="tag-text" fill="#94a3b8">Sigstore Cosign &amp; Zero-Trust</text>
    </g>

    <!-- Badge 4: AI & MCP -->
    <g transform="translate(634, 0)">
      <rect width="194" height="52" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1" />
      <text x="18" y="23" font-family="sans-serif" font-size="16" font-weight="900" fill="#f472b6">🤖 AI / MCP Agents</text>
      <text x="18" y="41" class="tag-text" fill="#94a3b8">SRE RAG &amp; Auto-Healing</text>
    </g>
  </g>
</svg>
