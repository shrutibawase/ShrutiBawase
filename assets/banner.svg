<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#9b51e0;#00f2fe" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#9b51e0">
        <animate attributeName="stop-color" values="#9b51e0;#00f2fe;#00c6ff;#9b51e0" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#9b51e0;#4facfe" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Heavy Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Grid Pattern -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
      <circle cx="28" cy="28" r="1" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }
    .pulsing-dot { animation: pulseDot 1.8s infinite ease-in-out; }
    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#textGrad);
    }
    .hero-sub {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .badge-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 800;
    }
    .badge-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base with Rounded Corners -->
  <rect x="2" y="2" width="916" height="276" rx="18" fill="url(#bgGrad)" stroke="url(#borderAnim)" stroke-width="2.5" />
  <rect x="2" y="2" width="916" height="276" rx="18" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="40" r="120" fill="#0284c7" opacity="0.15" filter="blur(50px)" />
  <circle cx="720" cy="50" r="130" fill="#8b5cf6" opacity="0.14" filter="blur(55px)" />
  <circle cx="460" cy="240" r="140" fill="#0052d4" opacity="0.12" filter="blur(50px)" />

  <!-- Top Status Pill -->
  <g transform="translate(315, 24)">
    <rect width="290" height="26" rx="13" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.2" />
    <circle cx="16" cy="13" r="5" fill="#10b981" class="pulsing-dot" />
    <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#34d399" letter-spacing="0.5px">AVAILABLE FOR LEADERSHIP &amp; ADVISORY</text>
  </g>

  <!-- Big Hero Name -->
  <g transform="translate(460, 98)" text-anchor="middle">
    <text class="hero-name" font-size="46" filter="url(#neonGlow)">SHRUTI BAWASE</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(460, 134)" text-anchor="middle">
    <text class="hero-sub">ENTERPRISE CLOUD ARCHITECT &bull; LEAD DEVSECOPS &bull; AI / LLMOPS PIONEER</text>
  </g>

  <!-- 4 Interactive High-Impact Cards -->
  <g transform="translate(38, 168)">
    <!-- Card 1: 100+ Migrations -->
    <g transform="translate(0, 0)">
      <rect width="198" height="84" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <text x="18" y="32" class="badge-title" fill="#38bdf8">🚀 100+ Workloads</text>
      <text x="18" y="52" class="badge-sub">Zero-Downtime Migration</text>
      <text x="18" y="68" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">Azure CAF &bull; Hub &amp; Spoke</text>
    </g>

    <!-- Card 2: FinOps -->
    <g transform="translate(216, 0)">
      <rect width="198" height="84" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2" />
      <text x="18" y="32" class="badge-title" fill="#34d399">💰 28%+ FinOps</text>
      <text x="18" y="52" class="badge-sub">Cloud OPEX Reduction</text>
      <text x="18" y="68" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#059669">Rightsizing &bull; Infracost Gates</text>
    </g>

    <!-- Card 3: SLSA L3 DevSecOps -->
    <g transform="translate(434, 0)">
      <rect width="202" height="84" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
      <text x="18" y="32" class="badge-title" fill="#c084fc">🔒 SLSA Level 3</text>
      <text x="18" y="52" class="badge-sub">Zero-Trust DevSecOps</text>
      <text x="18" y="68" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#9333ea">Sigstore Cosign &bull; Kyverno</text>
    </g>

    <!-- Card 4: AI & MCP Platform -->
    <g transform="translate(654, 0)">
      <rect width="190" height="84" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1.2" />
      <text x="18" y="32" class="badge-title" fill="#f472b6">🤖 AI / MCP Agents</text>
      <text x="18" y="52" class="badge-sub">SRE Copilot &amp; Auto-Heal</text>
      <text x="18" y="68" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#db2777">65% MTTR Reduction</text>
    </g>
  </g>
</svg>
